# Nombre de la aplicación
spring.application.name=api

# Puerto del servidor
server.port=8080

# -------------------------------------------------------------
# CONEXIÓN A MYSQL MEDIANTE JDBC (HSBC / HikariCP)
# Puerto 3306, Usuario 'root', Sin contraseña
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/beerhouse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del Pool de Conexiones HikariCP (JDBC)
spring.datasource.hikari.pool-name=BeerhouseHikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------
# CONFIGURACIÓN DE JPA / HIBERNATE
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# MANEJO DE ARCHIVOS LOGS DEL SISTEMA
# -------------------------------------------------------------
logging.file.name=logs/beerhouse-api.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=1GB
logging.level.root=INFO
logging.level.com.microserviciobeerhouse.api=DEBUG
logging.level.org.springframework.web=INFO
